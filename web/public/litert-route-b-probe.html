<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LiteRT Route B Probe — #19 sendMessage+vision a/b/c</title>
<style>
body { font-family: monospace; padding: 1rem; background: #111; color: #ddd; }
pre { background: #222; padding: 0.8rem; border-radius: 4px; overflow: auto; font-size: 0.82rem;
      white-space: pre-wrap; max-height: 75vh; }
.ok   { color: #4f4; }
.err  { color: #f44; }
.info { color: #8be; }
.warn { color: #fa4; }
h2 { color: #8be; margin-top: 1.2rem; }
</style>
</head>
<body>
<h1>LiteRT Route B Probe v8 — #19</h1>
<p>
  Streaming load path: <code>ReadableStreamDataStreamWrapper</code> → <code>Engine.createStreaming</code>
  (kAdvancedLegacyTfLite, not kAdvancedLiteRTCompiledModel).<br>
  Avoids E4B JS-OOM + sidesteps gpu_artisan executor crash. Observes a/b/c from sendMessage.
</p>
<h2>Log</h2>
<pre id="log">Starting...</pre>

<script>
const logEl = document.getElementById('log');
function emit(msg, cls = '') {
  const ts = new Date().toISOString().slice(11, 23);
  logEl.innerHTML += `<span class="${cls}">[${ts}] ${msg}\n</span>`;
  logEl.scrollTop = logEl.scrollHeight;
}
</script>

<!-- Non-compat WASM — GPU Artisan streaming path requires Engine.createStreaming -->
<script src="https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.1/wasm/litertlm_wasm_internal.js"></script>

<script>
const CDN_WASM_BASE = 'https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.1/wasm';
// E4B deliverable model — 2.97GB; streaming load avoids JS OOM
const MODEL_URL = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';

// Minimal 1×1 PNG base64
const TEST_IMAGE_B64 =
  'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';

// ── Inline ReadableStreamDataStreamWrapper (JS translation from LiteRT-LM TS) ──

class Slice {
  constructor(size) {
    this.size = size;
    this.data = null;
    this.fullyDiscarded = false;
    this.discardedRegions = [];
  }
  discard(start, end) {
    if (this.fullyDiscarded) return;
    this.discardedRegions.push([start, end]);
    this.discardedRegions.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of this.discardedRegions) {
      const last = merged[merged.length - 1];
      if (!last || last[1] < r[0]) merged.push([r[0], r[1]]);
      else last[1] = Math.max(last[1], r[1]);
    }
    this.discardedRegions = merged;
    if (this.discardedRegions.length === 1 &&
        this.discardedRegions[0][0] === 0 &&
        this.discardedRegions[0][1] === this.size) {
      this.fullyDiscarded = true;
      this.data = undefined;
    }
  }
  getDiscardedRegions(start, end) {
    return this.discardedRegions.filter(([s, e]) => s < end && e > start);
  }
}

class ReadableStreamDataStreamWrapper {
  constructor(stream, getWasmHeap, bytesPerSlice = 10_000_000) {
    this.getWasmHeap = getWasmHeap;
    this.bytesPerSlice = bytesPerSlice;
    this.slices = [];
    this.streamDone = false;
    this.globalPosition = 0;
    this.leftoverData = undefined;
    this.isReading = false;
    try {
      this.byobReader = stream.getReader({ mode: 'byob' });
    } catch {
      this.defaultReader = stream.getReader();
    }
  }

  *getViews(start, end) {
    if (start >= end) return;
    let scratchBuffer;
    let previousSlice;
    let position = start;
    while (position < end) {
      const sliceIndex = Math.floor(position / this.bytesPerSlice);
      const slicePos = position % this.bytesPerSlice;
      const sliceStart = sliceIndex * this.bytesPerSlice;
      let slice = this.slices[sliceIndex];
      if (!slice) {
        if (!previousSlice || !previousSlice.fullyDiscarded) {
          scratchBuffer = new Uint8Array(this.bytesPerSlice);
        }
        slice = new Slice(this.bytesPerSlice);
        slice.data = scratchBuffer;
        this.slices[sliceIndex] = slice;
      }
      const viewEnd = Math.min(this.bytesPerSlice, end - sliceStart);
      const viewLen = viewEnd - slicePos;
      const capturedSlice = slice;
      const capturedSlicePos = slicePos;
      const capturedViewEnd = viewEnd;
      yield {
        getView: () => new Uint8Array(
          capturedSlice.data.buffer,
          capturedSlice.data.byteOffset + capturedSlicePos,
          viewLen
        ),
        discardView: () => capturedSlice.discard(capturedSlicePos, capturedViewEnd),
        setView: (view) => {
          capturedSlice.data = new Uint8Array(view.buffer, 0, view.buffer.byteLength);
          scratchBuffer = capturedSlice.data;
        },
        checkReadable: () => {
          if (capturedSlice.getDiscardedRegions(capturedSlicePos, capturedViewEnd).length)
            throw new Error(`Slice ${sliceIndex} overlaps discarded region`);
          if (!capturedSlice.data)
            throw new Error(`No buffer for slice ${sliceIndex}`);
        },
      };
      previousSlice = slice;
      position += viewLen;
    }
  }

  async fillBufferFromStream(buffer) {
    const byteLength = buffer.byteLength;
    if (byteLength === 0) return buffer;
    let bytesRead = 0;
    let arrayBuffer = buffer.buffer;
    const byteOffset = buffer.byteOffset;
    while (bytesRead < byteLength) {
      if (this.streamDone && (!this.leftoverData || !this.leftoverData.length))
        throw new Error(`EOF at stream position ${this.globalPosition}`);
      if (this.byobReader) {
        const view = new Uint8Array(arrayBuffer, byteOffset + bytesRead, byteLength - bytesRead);
        const result = await this.byobReader.read(view);
        if (result.done) this.streamDone = true;
        if (!result.value) throw new Error('Stream returned null');
        this.globalPosition += result.value.byteLength;
        bytesRead += result.value.byteLength;
        arrayBuffer = result.value.buffer;
      } else {
        let chunk;
        if (this.leftoverData && this.leftoverData.length > 0) {
          chunk = this.leftoverData;
          this.leftoverData = undefined;
        } else {
          const result = await this.defaultReader.read();
          if (result.done) { this.streamDone = true; if (!result.value) continue; }
          if (!result.value) throw new Error('Stream returned null');
          chunk = result.value;
        }
        const needed = byteLength - bytesRead;
        const toCopy = Math.min(chunk.length, needed);
        new Uint8Array(arrayBuffer, byteOffset + bytesRead, toCopy).set(chunk.subarray(0, toCopy));
        if (chunk.length > toCopy) this.leftoverData = chunk.subarray(toCopy);
        this.globalPosition += toCopy;
        bytesRead += toCopy;
      }
    }
    return new Uint8Array(arrayBuffer, byteOffset, bytesRead);
  }

  async readInternal(destAddress, offset, count, discard) {
    if (this.isReading) throw new Error('Concurrent reads not supported');
    this.isReading = true;
    try {
      // 1. Read and cache unfetched data before requested region
      for (const {getView, setView} of this.getViews(this.globalPosition, offset)) {
        const newView = await this.fillBufferFromStream(getView());
        setView(newView);
        if (newView.length === 0) break;
      }
      // 2. Copy cached data from existing slices
      const endOfCached = Math.min(this.globalPosition, offset + count);
      let dest = destAddress;
      for (const {getView, discardView} of this.getViews(offset, endOfCached)) {
        const view = getView();
        this.getWasmHeap().set(view, dest);
        if (discard) discardView();
        dest += view.length;
      }
      // 3. Read remaining unfetched data
      const startUncached = Math.max(endOfCached, offset);
      for (const {getView, setView, discardView} of this.getViews(startUncached, offset + count)) {
        if (this.streamDone && this.globalPosition <= startUncached) break;
        const newView = await this.fillBufferFromStream(getView());
        setView(newView);
        this.getWasmHeap().set(newView, dest);
        if (discard) discardView();
        dest += newView.length;
      }
    } finally {
      this.isReading = false;
    }
  }

  async readAndDiscard(destAddress, offset, count) {
    try {
      await this.readInternal(destAddress >>> 0, Number(offset), Number(count), true);
      return {};
    } catch (e) { return { error: e }; }
  }
  async readAndPreserve(destAddress, offset, count) {
    try {
      await this.readInternal(destAddress >>> 0, Number(offset), Number(count), false);
      return {};
    } catch (e) { return { error: e }; }
  }
  async discard(offset, count) {
    try {
      for (const {discardView} of this.getViews(Number(offset), Number(offset) + Number(count)))
        discardView();
      return {};
    } catch (e) { return { error: e }; }
  }
}

// ── Main probe ───────────────────────────────────────────────────────────────

window.addEventListener('load', async () => {
  emit('=== LiteRT Route B Probe v8 — streaming + Engine.createStreaming ===', 'info');
  const wasmLog = [];
  let m;

  try {
    // ── 1. WASM init ─────────────────────────────────────────────────────────
    emit('1. ModuleFactory (CDN WASM, non-compat)...', 'info');
    m = await ModuleFactory({
      locateFile: (path) => `${CDN_WASM_BASE}/${path}`,
      print:    (text) => { wasmLog.push({ s: 'out', text }); emit(`  [wasm:out] ${text}`, 'info'); },
      printErr: (text) => { wasmLog.push({ s: 'err', text }); emit(`  [wasm:err] ${text}`, 'warn'); },
    });
    if (m.setupLogging) m.setupLogging();
    emit('   ✓ WASM ready', 'ok');

    // ── 2. WebGPU device setup (required for GPU_ARTISAN streaming path) ─────
    emit('2. WebGPU device setup...', 'info');
    if (!navigator.gpu) throw new Error('navigator.gpu not available — WebGPU disabled');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('No WebGPU adapter available');
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxBufferSize: adapter.limits.maxBufferSize,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      },
    });
    m.preinitializedWebGPUDevice = device;
    emit(`   ✓ WebGPU device ready (maxBufferSize=${(device.limits.maxBufferSize/1e9).toFixed(2)}GB)`, 'ok');

    // ── 3. Fetch model as ReadableStream (no buffering — avoids JS OOM on 2.97GB) ─
    emit(`3. Fetch ${MODEL_URL.slice(0, 80)}...`, 'info');
    const resp = await fetch(MODEL_URL);
    if (!resp.ok) throw new Error(`fetch failed: ${resp.status} ${resp.statusText}`);
    const totalBytes = parseInt(resp.headers.get('content-length') || '0', 10);
    emit(`   content-length: ${(totalBytes / 1e9).toFixed(2)} GB (streaming, no full-buffer alloc)`, 'info');

    // ── 4. ReadableStreamDataStreamWrapper ────────────────────────────────────
    emit('4. ReadableStreamDataStreamWrapper → ReadableStreamDataStream...', 'info');
    const streamWrapper = new ReadableStreamDataStreamWrapper(resp.body, () => m.HEAPU8);
    const dataStream = m.ReadableStreamDataStream.create(streamWrapper);
    emit('   ✓ WASM data stream created', 'ok');

    // ── 5. ModelAssets.createStreaming ────────────────────────────────────────
    emit('5. ModelAssets.createStreaming(dataStream)...', 'info');
    const modelAssets = m.ModelAssets.createStreaming(dataStream);
    emit('   ✓ ModelAssets (streaming) ready', 'ok');

    // ── 6. EngineSettings ─────────────────────────────────────────────────────
    emit('6. EngineSettings.createDefault(GPU_ARTISAN)...', 'info');
    const settings = m.EngineSettings.createDefault(modelAssets, m.Backend.GPU_ARTISAN);
    settings.setParallelFileSectionLoading(false);
    settings.setSingleThreadedExecution(true);
    emit('   ✓ Settings ready (parallelFileSectionLoading=false, singleThreaded=true)', 'ok');

    // ── 7. Engine.createStreaming → kAdvancedLegacyTfLite path ───────────────
    emit('7. Engine.createStreaming(settings, "")  [kAdvancedLegacyTfLite, not kAdvancedLiteRTCompiledModel]...', 'info');
    emit('   NOTE: this downloads+parses model on-demand; may take several minutes for 2.97GB', 'warn');
    const engine = await m.Engine.createStreaming(settings, '');
    emit('   ✓ Engine created via streaming! Reached past gpu_artisan wall.', 'ok');

    // Cleanup data stream
    dataStream.delete();

    // ── 8. SessionConfig with vision enabled ──────────────────────────────────
    emit('8. SessionConfig { visionModalityEnabled: true }...', 'info');
    const sessionConfig = m.SessionConfig.createDefault();
    sessionConfig.setVisionModalityEnabled(true);
    emit('   ✓ visionModalityEnabled=true', 'ok');

    // ── 9. ConversationConfig ─────────────────────────────────────────────────
    emit('9. ConversationConfig.createCustom...', 'info');
    const convConfig = m.ConversationConfig.createCustom(
      engine, sessionConfig, false, false, false, ''
    );
    emit('   ✓ ConversationConfig created', 'ok');

    // ── 10. Conversation.create ───────────────────────────────────────────────
    emit('10. Conversation.create(engine, convConfig)...', 'info');
    const conv = await m.Conversation.create(engine, convConfig);
    emit('   ✓ Conversation created — reaching sendMessage', 'ok');

    // ── 11. sendMessage with vision content ──────────────────────────────────
    emit('11. sendMessage({ role:"user", content:[text+image] })...', 'info');
    const msgJson = JSON.stringify({
      role: 'user',
      content: [
        { type: 'text',  text: 'What do you see in this image?' },
        { type: 'image', blob: TEST_IMAGE_B64 },
      ],
    });
    emit(`   payload length: ${msgJson.length} chars`, 'info');
    const resultStr = await conv.sendMessage(msgJson);
    emit('   ✓ sendMessage returned', 'ok');

    let result;
    try { result = JSON.parse(resultStr); } catch { result = resultStr; }
    const responseText = (typeof result === 'object' && result?.content)
      ? (Array.isArray(result.content)
          ? result.content.map(c => c.text || '').join('')
          : String(result.content))
      : String(resultStr);

    emit(`   response text: ${responseText.slice(0, 300)}`, 'ok');

    // Classify a vs b
    const imageRefs = /color|pixel|image|see|show|depict|visual|picture|look/i.test(responseText);
    const verdict = imageRefs ? 'OUTCOME_A_IMAGE_GROUNDED' : 'OUTCOME_B_TEXT_ONLY_FALLBACK';
    emit(`\n=== VERDICT: ${verdict} ===`, 'ok');
    window.__routeBResult = { ok: true, verdict, responseText, wasmLog };

  } catch (err) {
    const msg = err.message || String(err);
    emit(`\n✗ CAUGHT: ${msg}`, 'err');
    if (err.stack) emit(err.stack.split('\n').slice(0, 8).join('\n'), 'err');

    const isVisionCalc  = /LlmVisionInferenceCalculator|VisionInference.*Calc|Calculator.*not.*regist/i.test(msg);
    const isVisionRun   = /VisionRunner|vision.*runner|MultiModal.*runner/i.test(msg);
    const isJsOom       = /Array buffer allocation|out of memory|allocation failed/i.test(msg);
    const isWasmAbort   = /Aborted/i.test(msg);
    const isWebGpu      = /WebGPU|adapter|gpu.*device|requestAdapter/i.test(msg);
    const isTokenizer   = /tokeniz|vocab|token.*fail/i.test(msg);

    let verdict;
    if (isVisionCalc)  verdict = 'OUTCOME_C_VISION_CALC_MISSING';
    else if (isVisionRun) verdict = 'OUTCOME_C_RUNNER_MISSING';
    else if (isJsOom)  verdict = 'JS_OOM_PRE_WASM';
    else if (isWebGpu) verdict = 'WEBGPU_INIT_FAIL';
    else if (isWasmAbort) verdict = 'WASM_ABORT_UNKNOWN';
    else if (isTokenizer) verdict = 'TOKENIZER_FAIL';
    else                verdict = 'UNKNOWN_ERROR';

    const stderrLines = wasmLog.filter(l => l.s === 'err').slice(-25).map(l => l.text);
    emit(`\n=== VERDICT: ${verdict} ===`, 'err');
    emit(`=== last WASM stderr (${stderrLines.length} lines): ===`, 'info');
    stderrLines.forEach(l => emit(`  ${l}`, 'warn'));

    window.__routeBResult = { ok: false, verdict, error: msg, wasmLog };
  }

  console.log('__routeBResult', JSON.stringify(window.__routeBResult, null, 2));
});
</script>
</body>
</html>
