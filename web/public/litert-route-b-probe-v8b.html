<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LiteRT Route B Probe v8b — text-only engine smoke test</title>
<style>
body { font-family: monospace; padding: 1rem; background: #111; color: #ddd; }
pre { background: #222; padding: 0.8rem; border-radius: 4px; overflow: auto; font-size: 0.82rem;
      white-space: pre-wrap; max-height: 75vh; }
.ok   { color: #4f4; }
.err  { color: #f44; }
.info { color: #8be; }
.warn { color: #fa4; }
h2 { color: #8be; margin-top: 1.2rem; }
</style>
</head>
<body>
<h1>LiteRT Route B Probe v8b — text-only smoke test</h1>
<p>
  Same streaming path as v8. Vision modality DISABLED. Confirms end-to-end text
  inference pipeline: Engine.createStreaming → Conversation.create → sendMessage(text).
</p>
<h2>Log</h2>
<pre id="log">Starting...</pre>

<script>
const logEl = document.getElementById('log');
function emit(msg, cls = '') {
  const ts = new Date().toISOString().slice(11, 23);
  logEl.innerHTML += `<span class="${cls}">[${ts}] ${msg}\n</span>`;
  logEl.scrollTop = logEl.scrollHeight;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.1/wasm/litertlm_wasm_internal.js"></script>

<script>
const CDN_WASM_BASE = 'https://cdn.jsdelivr.net/npm/@litert-lm/core@0.12.1/wasm';
const MODEL_URL = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';

// ── Minimal ReadableStreamDataStreamWrapper (same as v8) ─────────────────────

class Slice {
  constructor(size) { this.size = size; this.data = null; this.fullyDiscarded = false; this.discardedRegions = []; }
  discard(start, end) {
    if (this.fullyDiscarded) return;
    this.discardedRegions.push([start, end]);
    this.discardedRegions.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of this.discardedRegions) {
      const last = merged[merged.length - 1];
      if (!last || last[1] < r[0]) merged.push([r[0], r[1]]); else last[1] = Math.max(last[1], r[1]);
    }
    this.discardedRegions = merged;
    if (this.discardedRegions.length === 1 && this.discardedRegions[0][0] === 0 && this.discardedRegions[0][1] === this.size) {
      this.fullyDiscarded = true; this.data = undefined;
    }
  }
  getDiscardedRegions(start, end) { return this.discardedRegions.filter(([s, e]) => s < end && e > start); }
}

class ReadableStreamDataStreamWrapper {
  constructor(stream, getWasmHeap, bytesPerSlice = 10_000_000) {
    this.getWasmHeap = getWasmHeap; this.bytesPerSlice = bytesPerSlice;
    this.slices = []; this.streamDone = false; this.globalPosition = 0;
    this.leftoverData = undefined; this.isReading = false;
    try { this.byobReader = stream.getReader({ mode: 'byob' }); }
    catch { this.defaultReader = stream.getReader(); }
  }
  *getViews(start, end) {
    if (start >= end) return;
    let scratchBuffer, previousSlice;
    let position = start;
    while (position < end) {
      const sliceIndex = Math.floor(position / this.bytesPerSlice);
      const slicePos = position % this.bytesPerSlice;
      const sliceStart = sliceIndex * this.bytesPerSlice;
      let slice = this.slices[sliceIndex];
      if (!slice) {
        if (!previousSlice || !previousSlice.fullyDiscarded) scratchBuffer = new Uint8Array(this.bytesPerSlice);
        slice = new Slice(this.bytesPerSlice); slice.data = scratchBuffer; this.slices[sliceIndex] = slice;
      }
      const viewEnd = Math.min(this.bytesPerSlice, end - sliceStart);
      const viewLen = viewEnd - slicePos;
      const cs = slice, csp = slicePos, cve = viewEnd;
      yield {
        getView: () => new Uint8Array(cs.data.buffer, cs.data.byteOffset + csp, viewLen),
        discardView: () => cs.discard(csp, cve),
        setView: (view) => { cs.data = new Uint8Array(view.buffer, 0, view.buffer.byteLength); scratchBuffer = cs.data; },
        checkReadable: () => { if (cs.getDiscardedRegions(csp, cve).length) throw new Error('slice overlap'); if (!cs.data) throw new Error('no buffer'); },
      };
      previousSlice = slice; position += viewLen;
    }
  }
  async fillBufferFromStream(buffer) {
    const byteLength = buffer.byteLength; if (byteLength === 0) return buffer;
    let bytesRead = 0; let arrayBuffer = buffer.buffer; const byteOffset = buffer.byteOffset;
    while (bytesRead < byteLength) {
      if (this.streamDone && (!this.leftoverData || !this.leftoverData.length)) throw new Error(`EOF at ${this.globalPosition}`);
      if (this.byobReader) {
        const view = new Uint8Array(arrayBuffer, byteOffset + bytesRead, byteLength - bytesRead);
        const result = await this.byobReader.read(view);
        if (result.done) this.streamDone = true; if (!result.value) throw new Error('null from stream');
        this.globalPosition += result.value.byteLength; bytesRead += result.value.byteLength; arrayBuffer = result.value.buffer;
      } else {
        let chunk;
        if (this.leftoverData && this.leftoverData.length > 0) { chunk = this.leftoverData; this.leftoverData = undefined; }
        else { const result = await this.defaultReader.read(); if (result.done) { this.streamDone = true; if (!result.value) continue; } if (!result.value) throw new Error('null from stream'); chunk = result.value; }
        const needed = byteLength - bytesRead; const toCopy = Math.min(chunk.length, needed);
        new Uint8Array(arrayBuffer, byteOffset + bytesRead, toCopy).set(chunk.subarray(0, toCopy));
        if (chunk.length > toCopy) this.leftoverData = chunk.subarray(toCopy);
        this.globalPosition += toCopy; bytesRead += toCopy;
      }
    }
    return new Uint8Array(arrayBuffer, byteOffset, bytesRead);
  }
  async readInternal(destAddress, offset, count, discard) {
    if (this.isReading) throw new Error('concurrent read');
    this.isReading = true;
    try {
      for (const {getView, setView} of this.getViews(this.globalPosition, offset)) {
        const nv = await this.fillBufferFromStream(getView()); setView(nv); if (nv.length === 0) break;
      }
      const endOfCached = Math.min(this.globalPosition, offset + count); let dest = destAddress;
      for (const {getView, discardView} of this.getViews(offset, endOfCached)) {
        const v = getView(); this.getWasmHeap().set(v, dest); if (discard) discardView(); dest += v.length;
      }
      const startUncached = Math.max(endOfCached, offset);
      for (const {getView, setView, discardView} of this.getViews(startUncached, offset + count)) {
        if (this.streamDone && this.globalPosition <= startUncached) break;
        const nv = await this.fillBufferFromStream(getView()); setView(nv);
        this.getWasmHeap().set(nv, dest); if (discard) discardView(); dest += nv.length;
      }
    } finally { this.isReading = false; }
  }
  async readAndDiscard(da, off, cnt) { try { await this.readInternal(da >>> 0, Number(off), Number(cnt), true); return {}; } catch(e) { return {error:e}; } }
  async readAndPreserve(da, off, cnt) { try { await this.readInternal(da >>> 0, Number(off), Number(cnt), false); return {}; } catch(e) { return {error:e}; } }
  async discard(off, cnt) { try { for (const {discardView} of this.getViews(Number(off), Number(off)+Number(cnt))) discardView(); return {}; } catch(e) { return {error:e}; } }
}

// ── Main probe ────────────────────────────────────────────────────────────────

window.addEventListener('load', async () => {
  emit('=== LiteRT Probe v8b — text-only, no vision, smoke test ===', 'info');
  const wasmLog = [];
  let m;

  try {
    emit('1. ModuleFactory...', 'info');
    m = await ModuleFactory({
      locateFile: (path) => `${CDN_WASM_BASE}/${path}`,
      print:    (text) => { wasmLog.push({s:'out',text}); emit(`  [wasm:out] ${text}`, 'info'); },
      printErr: (text) => { wasmLog.push({s:'err',text}); emit(`  [wasm:err] ${text}`, 'warn'); },
    });
    if (m.setupLogging) m.setupLogging();
    emit('   ✓ WASM ready', 'ok');

    emit('2. WebGPU device...', 'info');
    if (!navigator.gpu) throw new Error('no navigator.gpu');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('no WebGPU adapter');
    const device = await adapter.requestDevice();
    m.preinitializedWebGPUDevice = device;
    emit('   ✓ WebGPU ready', 'ok');

    emit(`3. Fetch model (streaming, no buffer alloc)...`, 'info');
    const resp = await fetch(MODEL_URL);
    if (!resp.ok) throw new Error(`fetch ${resp.status}`);
    const total = parseInt(resp.headers.get('content-length')||'0');
    emit(`   content-length: ${(total/1e9).toFixed(2)} GB`, 'info');

    emit('4. ReadableStreamDataStream...', 'info');
    const wrapper = new ReadableStreamDataStreamWrapper(resp.body, () => m.HEAPU8);
    const dataStream = m.ReadableStreamDataStream.create(wrapper);
    emit('   ✓', 'ok');

    emit('5. ModelAssets.createStreaming...', 'info');
    const modelAssets = m.ModelAssets.createStreaming(dataStream);
    emit('   ✓', 'ok');

    emit('6. EngineSettings (GPU_ARTISAN, vision DISABLED)...', 'info');
    const settings = m.EngineSettings.createDefault(modelAssets, m.Backend.GPU_ARTISAN);
    settings.setParallelFileSectionLoading(false);
    settings.setSingleThreadedExecution(true);
    emit('   ✓', 'ok');

    emit('7. Engine.createStreaming...', 'info');
    const engine = await m.Engine.createStreaming(settings, '');
    dataStream.delete();
    emit('   ✓ Engine created', 'ok');

    emit('8. SessionConfig (visionModalityEnabled=false)...', 'info');
    const sessionConfig = m.SessionConfig.createDefault();
    sessionConfig.setVisionModalityEnabled(false);  // DISABLED — text-only test
    emit('   ✓', 'ok');

    emit('9. ConversationConfig.createCustom...', 'info');
    const convConfig = m.ConversationConfig.createCustom(engine, sessionConfig, false, false, false, '');
    emit('   ✓', 'ok');

    emit('10. Conversation.create...', 'info');
    const conv = await m.Conversation.create(engine, convConfig);
    emit('   ✓ Conversation created', 'ok');

    emit('11. sendMessage (text only: "Reply with one word: hello")...', 'info');
    const msgJson = JSON.stringify({ role:'user', content:[{ type:'text', text:'Reply with one word: hello' }] });
    const resultStr = await conv.sendMessage(msgJson);
    emit('   ✓ sendMessage returned', 'ok');

    let result;
    try { result = JSON.parse(resultStr); } catch { result = resultStr; }
    const text = (typeof result === 'object' && result?.content)
      ? (Array.isArray(result.content) ? result.content.map(c=>c.text||'').join('') : String(result.content))
      : String(resultStr);

    emit(`   response: ${text.slice(0,300)}`, 'ok');
    emit('\n=== VERDICT: TEXT_INFERENCE_PASS ===', 'ok');
    window.__routeBResult = { ok:true, verdict:'TEXT_INFERENCE_PASS', responseText:text, wasmLog };

  } catch (err) {
    const msg = err.message || String(err);
    emit(`\n✗ ${msg}`, 'err');
    const isVision = /Vision options|VisionExecutor|vision.*null/i.test(msg);
    const isOom    = /Array buffer allocation|out of memory/i.test(msg);
    const isAbort  = /Aborted/i.test(msg);
    const verdict  = isVision ? 'VISION_SETTINGS_NULL' : isOom ? 'JS_OOM' : isAbort ? 'WASM_ABORT' : 'TEXT_INFERENCE_FAIL';
    emit(`\n=== VERDICT: ${verdict} ===`, 'err');
    const stderrLines = wasmLog.filter(l=>l.s==='err').slice(-20).map(l=>l.text);
    stderrLines.forEach(l => emit(`  ${l}`, 'warn'));
    window.__routeBResult = { ok:false, verdict, error:msg, wasmLog };
  }
  console.log('__routeBResult', JSON.stringify(window.__routeBResult, null, 2));
});
</script>
</body>
</html>
